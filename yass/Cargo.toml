[package]
name = "yass"
version = "0.1.0"
edition = "2024"
authors = ["The A-Team"]
license = "MIT"
description = "Yet Another SSL Simulator"

[features]
default = ["gui"]
gui = ["dep:kiss3d"]

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
ctrlc = "3.5.2"
kiss3d = { version = "0.47.0", optional = true }
libloading = "0.9.0"
prost = "0.14.6"
rapier3d = "0.34.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
yass-corelib = { version = "0.1.0", path = "../corelib" }
yass-league-protos = { version = "0.1.0", path = "../league-protos" }

[package.metadata.deb]
depends = "$auto"
assets = [
    ["target/release/yass","usr/bin/","755"],
    ["target/release/yass_headless","usr/bin/","755"],
    ["target/release/yass_config_schema","usr/bin/","755"],
    ["target/release/libyass_standard_plugins.so","usr/lib/yass/plugins/","644"],
    ["target/release/include/yass_corelib.h","usr/include/yass/","644"],
    ["target/release/include/yass_corelib.hpp","usr/include/yass/","644"],
]

[[bin]]
name = "yass"
path = "src/bin/yass/main.rs"
required-features = ["gui"]
