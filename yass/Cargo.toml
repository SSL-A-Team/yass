[package]
name = "yass"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
ctrlc = "3.5.2"
libloading = "0.9.0"
rapier3d = "0.34.0"
rust-yaml = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
