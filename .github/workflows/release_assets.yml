name: Release Assets

on:
  release:
    types: [ "published" ]
  workflow_dispatch:

jobs:
  job1:
    name: Build Assets
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install protoc
      run: |
        sudo apt update
        sudo apt install protobuf-compiler

    - name: Build Installer
      run: cargo xtask deb

    - name: Publish Assets
      uses: softprops/action-gh-release@v2
      if: ${{github.event_name == 'release'}}
      with:
        files: |
          ${{github.workspace}}/target/release/yass_*.deb
